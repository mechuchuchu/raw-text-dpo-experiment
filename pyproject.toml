[project]
name = "raw-text-dpo-experiment"
version = "0.1.0"
description = "Exploratory raw-text causal LM training on DPO preference pairs"
requires-python = ">=3.10"
dependencies = [
  "datasets>=5.0",
  "transformers>=5.0",
  "peft>=0.21",
  "accelerate>=1.0",
  "pyyaml>=6.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

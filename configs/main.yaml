experiment_name: rawtext_dpo_main
seed: 42

dataset:
  name: allenai/Dolci-Instruct-DPO
  revision: aed155cf32e809b590490b6c3577ee4b0d0a5019
  split: train
  sample_size: 5000
  eval_fraction: 0.1
  single_turn_only: true
  drop_empty_answers: true

model:
  name: allenai/OLMo-2-0425-1B
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0002
  num_train_epochs: 1
  max_seq_length: 2048
  serialization_order: forward
  logging_steps: 10
  save_steps: 100

evaluation:
  arrangements: [aligned, swapped]
  orders: [forward, reverse]
  scoring_modes: [full_sequence, isolated_branch]

output:
  root_dir: outputs
